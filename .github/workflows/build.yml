name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: List repo structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== app-ios ==="
          ls -la app-ios/

      - name: Placeholder (compilación próximamente)
        run: |
          echo "✅ Workflow configurado correctamente"
          echo "⏳ Aún falta añadir el proyecto Xcode"
